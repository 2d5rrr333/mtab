name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install MoonBit toolchain
        # Pin to the toolchain the codebase is verified against; `latest`
        # may drift (moon exits -1/255 on failure, hard to attribute).
        # No CI fmt gate: 0.1.20260827 has no linux build, and 0.1.20260819
        # formats .mbt differently per platform (its linux moonc adds
        # struct-literal trailing commas, its windows one strips them).
        # Run `moon fmt --check` locally instead (toolchain 0.1.20260827).
        env:
          MOONBIT_INSTALL_VERSION: 0.1.20260819
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: Toolchain version
        run: moon version --all

      - name: Check
        run: moon check

      - name: Unit tests
        run: moon test

      - name: Build wasm (release)
        run: pwsh ./build.ps1 -Release

      - name: E2E over the FFI bridge
        run: node e2e.mjs

      - name: Upload web build
        uses: actions/upload-artifact@v4
        with:
          name: mtab-web
          path: web
