name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install MoonBit toolchain
        # `latest`: pinned versions proved fragile here — 0.1.20260827 has no
        # linux build and 0.1.20260819's download intermittently fails from CI.
        # The verified baseline is local (windows, 0.1.20260827): fmt --check,
        # check, test, e2e and headless all green; CI covers build + unit +
        # e2e. No CI fmt gate: the old toolchain formats .mbt differently per
        # platform, so formatting is enforced locally only.
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: Toolchain version
        run: moon version --all

      - name: Check
        run: moon check

      - name: Unit tests
        run: moon test

      - name: Build wasm (release)
        run: pwsh ./build.ps1 -Release

      - name: E2E over the FFI bridge
        run: node e2e.mjs

      - name: Upload web build
        uses: actions/upload-artifact@v4
        with:
          name: mtab-web
          path: web
