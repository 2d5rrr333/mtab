<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#1c1e26">
  <title>mtab · MoonBit 导航页</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- wallpaper crossfade layers (design D4) -->
  <div id="wallpaper-a" class="wallpaper-layer"></div>
  <div id="wallpaper-b" class="wallpaper-layer"></div>
  <!-- readability scrim above wallpaper, below content (design D3) -->
  <div id="scrim"></div>

  <main id="app">
    <!-- clock widget (design D5 partition) -->
    <header id="clock" class="widget">
      <div class="time" id="clock-time">--:--</div>
      <div class="date-line" id="clock-date"></div>
    </header>

    <!-- countdown widget (countdown-widget design D5) -->
    <section id="countdown" class="widget" hidden>
      <div class="countdown-head">
        <h3>倒数日</h3>
        <button id="cd-add" type="button" class="ghost-btn" title="添加倒数日">添加</button>
      </div>
      <ul id="cd-list" class="cd-list"></ul>
      <p class="cd-empty" id="cd-empty" hidden>还没有倒数日。点击「添加」记录生日、考试、纪念日。</p>
    </section>

    <!-- search box: always-on base component -->
    <section id="search">
      <div class="engine-bar" id="engine-bar"></div>
      <div class="search-row">
        <input id="search-input" type="text" placeholder="输入关键词，回车搜索" autocomplete="off" autofocus
               role="combobox" aria-expanded="false" aria-autocomplete="list" aria-controls="search-suggest">
        <button id="search-go" type="button" title="搜索">搜索</button>
        <div class="search-suggest" id="search-suggest" role="listbox" hidden></div>
      </div>
    </section>

    <!-- bookmark groups (bookmark-groups design D4) -->
    <section id="bookmarks">
      <div class="bm-toolbar-row">
        <button id="group-add" type="button" class="ghost-btn">新建分组</button>
      </div>
      <div id="bm-groups"></div>
      <div class="bm-empty" id="bm-empty" hidden>
        还没有书签。点击下方「添加书签」开始收藏常用站点。
      </div>
    </section>

    <!-- toolbar -->
    <div class="toolbar">
      <button id="bm-add" type="button">添加书签</button>
      <button id="settings-open" type="button">设置</button>
    </div>
  </main>

  <!-- bookmark add/edit form (modal) -->
  <div class="modal-backdrop" id="bm-modal" hidden>
    <form class="modal" id="bm-form">
      <h3 id="bm-form-title">添加书签</h3>
      <label>名称<input name="name" type="text" placeholder="站点名称（留空则使用网址）"></label>
      <label>网址<input name="url" type="text" placeholder="example.com" required></label>
      <label>分组<select name="group" id="bm-form-group"></select></label>
      <p class="form-error" id="bm-form-error" hidden></p>
      <div class="modal-actions">
        <button type="submit">保存</button>
        <button type="button" id="bm-cancel">取消</button>
      </div>
    </form>
  </div>

  <!-- countdown add form (modal) -->
  <div class="modal-backdrop" id="cd-modal" hidden>
    <form class="modal" id="cd-form">
      <h3>添加倒数日</h3>
      <label>名称<input name="name" type="text" placeholder="生日、考试、纪念日…" required></label>
      <label>目标日期<input name="date" type="date" required></label>
      <p class="form-error" id="cd-form-error" hidden></p>
      <div class="modal-actions">
        <button type="submit">保存</button>
        <button type="button" id="cd-cancel">取消</button>
      </div>
    </form>
  </div>

  <!-- settings panel -->
  <div class="modal-backdrop" id="settings-modal" hidden>
    <div class="modal settings">
      <h3>设置</h3>

      <section>
        <h4>外观</h4>
        <div class="theme-picker" id="theme-picker">
          <button type="button" data-theme-set="dark">深色</button>
          <button type="button" data-theme-set="light">浅色</button>
          <button type="button" data-theme-set="auto">跟随系统</button>
        </div>
      </section>

      <section>
        <h4>小组件</h4>
        <label><input type="checkbox" id="toggle-clock"> 时钟</label>
        <label><input type="checkbox" id="toggle-bookmarks"> 书签网格</label>
        <label><input type="checkbox" id="toggle-countdown"> 倒数日</label>
      </section>

      <section>
        <h4>壁纸</h4>
        <div class="wallpaper-list" id="wallpaper-list"></div>
        <label class="upload-label">上传本地图片（长边压缩至 1920px）
          <input type="file" id="wallpaper-upload" accept="image/*">
        </label>
        <label class="blur-label">壁纸模糊度 <span id="wallpaper-blur-value">0</span> px
          <input type="range" id="wallpaper-blur" min="0" max="20" step="1" value="0">
        </label>
      </section>

      <section>
        <h4>配置</h4>
        <div class="config-actions">
          <button type="button" id="config-export">导出 JSON</button>
          <label class="btn-like">导入 JSON
            <input type="file" id="config-import" accept="application/json,.json">
          </label>
          <label class="btn-like">导入书签 HTML
            <input type="file" id="bookmark-import" accept="text/html,.html,.htm">
          </label>
          <button type="button" id="history-clear">清空搜索历史</button>
        </div>
      </section>

      <div class="modal-actions">
        <button type="button" id="settings-close">关闭</button>
      </div>
    </div>
  </div>

  <!-- jieqi info modal (ux-polish-2) -->
  <div class="modal-backdrop" id="term-modal" hidden>
    <div class="modal term-modal">
      <h3 id="term-modal-name"></h3>
      <p class="term-modal-lon" id="term-modal-lon"></p>
      <p class="term-modal-blurb" id="term-modal-blurb"></p>
      <div class="modal-actions">
        <button type="button" id="term-modal-close">关闭</button>
      </div>
    </div>
  </div>

  <!-- error toast -->
  <div id="toast" class="toast" hidden></div>

  <script src="app.js" type="module"></script>
</body>
</html>
