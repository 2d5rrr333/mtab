<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>mtab test harness</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- wallpaper crossfade layers (design D4) -->
  <div id="wallpaper-a" class="wallpaper-layer"></div>
  <div id="wallpaper-b" class="wallpaper-layer"></div>
  <!-- readability scrim above wallpaper, below content (design D3) -->
  <div id="scrim"></div>

  <!-- same skeleton as index.html; app.js renders into these nodes -->
  <main id="app">
    <header id="clock" class="widget">
      <div class="time" id="clock-time">--:--:--</div>
      <div class="date-line" id="clock-date"></div>
    </header>
    <section id="search">
      <div class="engine-bar" id="engine-bar"></div>
      <div class="search-row">
        <input id="search-input" type="text" placeholder="输入关键词，回车搜索" autocomplete="off"
               role="combobox" aria-expanded="false" aria-autocomplete="list" aria-controls="search-suggest">
        <button id="search-go" type="button" title="搜索">搜索</button>
        <div class="search-suggest" id="search-suggest" role="listbox" hidden></div>
      </div>
    </section>
    <section id="bookmarks">
      <div class="bm-toolbar-row">
        <button id="group-add" type="button" class="ghost-btn">新建分组</button>
      </div>
      <div id="bm-groups"></div>
      <div class="bm-empty" id="bm-empty" hidden>还没有书签。</div>
    </section>
    <div class="toolbar">
      <button id="bm-add" type="button">添加书签</button>
      <button id="settings-open" type="button">设置</button>
    </div>
  </main>

  <div class="modal-backdrop" id="bm-modal" hidden>
    <form class="modal" id="bm-form">
      <h3 id="bm-form-title">添加书签</h3>
      <label>名称<input name="name" type="text"></label>
      <label>网址<input name="url" type="text" required></label>
      <label>分组<select name="group" id="bm-form-group"></select></label>
      <p class="form-error" id="bm-form-error" hidden></p>
      <div class="modal-actions">
        <button type="submit">保存</button>
        <button type="button" id="bm-cancel">取消</button>
      </div>
    </form>
  </div>

  <div class="modal-backdrop" id="settings-modal" hidden>
    <div class="modal settings">
      <h3>设置</h3>
      <section>
        <h4>小组件</h4>
        <label><input type="checkbox" id="toggle-clock"> 时钟</label>
        <label><input type="checkbox" id="toggle-bookmarks"> 书签网格</label>
      </section>
      <section>
        <h4>壁纸</h4>
        <div class="wallpaper-list" id="wallpaper-list"></div>
        <label class="upload-label">上传本地图片
          <input type="file" id="wallpaper-upload" accept="image/*">
        </label>
        <label class="blur-label">壁纸模糊度 <span id="wallpaper-blur-value">0</span> px
          <input type="range" id="wallpaper-blur" min="0" max="20" step="1" value="0">
        </label>
      </section>
      <section>
        <h4>配置</h4>
        <div class="config-actions">
          <button type="button" id="config-export">导出 JSON</button>
          <label class="btn-like">导入 JSON
            <input type="file" id="config-import" accept="application/json,.json">
          </label>
          <button type="button" id="history-clear">清空搜索历史</button>
        </div>
      </section>
      <div class="modal-actions">
        <button type="button" id="settings-close">关闭</button>
      </div>
    </div>
  </div>

  <!-- jieqi info modal (ux-polish-2) -->
  <div class="modal-backdrop" id="term-modal" hidden>
    <div class="modal term-modal">
      <h3 id="term-modal-name"></h3>
      <p class="term-modal-lon" id="term-modal-lon"></p>
      <p class="term-modal-blurb" id="term-modal-blurb"></p>
      <div class="modal-actions">
        <button type="button" id="term-modal-close">关闭</button>
      </div>
    </div>
  </div>

  <div id="toast" class="toast" hidden></div>
  <ol id="test-results"></ol>

  <script>
    // boot error capture: must attach before the app module runs
    window.addEventListener('error', e => {
      const d = document.createElement('div');
      d.id = 'boot-error';
      d.textContent = 'BOOT-ERROR: ' + String(e.message) + ' @ ' + String(e.filename) + ':' + String(e.lineno);
      document.body.appendChild(d);
    });
    window.addEventListener('unhandledrejection', e => {
      const d = document.createElement('div');
      d.id = 'boot-error';
      d.textContent = 'BOOT-REJECTION: ' + String(e.reason && e.reason.stack || e.reason);
      document.body.appendChild(d);
    });
  </script>

  <script type="module">
    import './app.js';

    const results = [];
    function check(name, cond, detail) {
      results.push({ name, ok: !!cond, detail });
      const li = document.createElement('li');
      li.textContent = (cond ? 'PASS ' : 'FAIL ') + name +
        (cond || detail === undefined ? '' : ' :: ' + JSON.stringify(detail));
      li.style.color = cond ? '#0a0' : '#d00';
      document.getElementById('test-results').appendChild(li);
    }
    const $ = id => document.getElementById(id);
    const gridItems = () => [...document.querySelectorAll('.bm-group .bookmark')];
    const groupSections = () => [...document.querySelectorAll('.bm-group')];
    const groupState = () => window.mtab.config.groups;
    const allBookmarkIds = () => groupState().flatMap(g => g.bookmarks.map(b => b.id));
    // synthesize a full pointer drag over a card (bookmark-groups D3)
    const pointerDrag = (el, dx, dy) => {
      const r = el.getBoundingClientRect();
      const cx = r.left + r.width / 2;
      const cy = r.top + r.height / 2;
      const opts = { bubbles: true, cancelable: true, button: 0, isPrimary: true, pointerId: 1 };
      el.dispatchEvent(new PointerEvent('pointerdown', { ...opts, clientX: cx, clientY: cy }));
      const steps = 6;
      for (let i = 1; i <= steps; i++) {
        document.dispatchEvent(new PointerEvent('pointermove', {
          ...opts,
          clientX: cx + (dx * i) / steps,
          clientY: cy + (dy * i) / steps,
        }));
      }
      document.dispatchEvent(new PointerEvent('pointerup', {
        ...opts,
        clientX: cx + dx,
        clientY: cy + dy,
      }));
    };
    const activeWallpaper = () => window.mtab.wallpaperLayer();
    const ruleFor = selector => {
      for (const sheet of document.styleSheets) {
        for (const rule of sheet.cssRules) {
          if (rule.selectorText === selector) {
            return rule;
          }
        }
      }
      return null;
    };
    // like ruleFor but walks into @media/@supports blocks too
    const rulesWhere = pred => {
      const found = [];
      const walk = rules => {
        for (const rule of rules) {
          if (pred(rule)) {
            found.push(rule);
          }
          if (rule.cssRules) {
            walk(rule.cssRules);
          }
        }
      };
      for (const sheet of document.styleSheets) {
        walk(sheet.cssRules);
      }
      return found;
    };
    const cs = el => getComputedStyle(el);

    // Intercept new-tab navigation (bookmark clicks) so the harness stays put.
    const opened = [];
    window.open = (url, target) => { opened.push(url); return null; };

    const tick = () => new Promise(r => setTimeout(r, 0));
    // Poll until the condition holds. Bounded by ITERATIONS, not wall-clock:
    // headless virtual time makes Date.now() deadlines unreliable (the loop
    // would starve the virtual-time budget and hang the dump).
    async function until(fn, maxIters = 150) {
      for (let i = 0; i < maxIters; i++) {
        if (fn()) {
          return true;
        }
        await new Promise(r => setTimeout(r, 20));
      }
      return fn();
    }

    await new Promise(r => setTimeout(r, 50)); // let the app settle

    // -- initial render --
    check('clock visible by default', !$('clock').hidden);
    check('clock date includes 星期', $('clock-date').textContent.includes('星期'));
    check('search input autofocused', document.activeElement === $('search-input'));
    check('bookmark empty state visible', !$('bm-empty').hidden);

    // -- ui-polish: presentation assertions --
    // 1.1 clock digit stability
    check('clock uses tabular numerals',
      cs($('clock-time')).fontVariantNumeric.includes('tabular-nums') &&
      cs($('clock-time')).fontWeight === '300',
      cs($('clock-time')).fontVariantNumeric);
    const cw1 = $('clock-time').offsetWidth;
    await new Promise(r => setTimeout(r, 1050)); // one virtual second passes
    const cw2 = $('clock-time').offsetWidth;
    check('clock width stable across a second tick', cw1 === cw2 && cw1 > 0,
      { cw1, cw2 });
    // 1.2 focus state
    // NOTE: computed styles of TRANSITIONED properties freeze at their start
    // value under headless virtual time, so assert the rule + focus behavior.
    check('search input focus style rule',
      ruleFor('#search-input:focus') &&
      ruleFor('#search-input:focus').style.boxShadow.includes('rgba(255, 255, 255'));
    const inp = $('search-input');
    inp.focus();
    check('search input receives focus', document.activeElement === inp);
    // 1.3 scrim
    const scrim = cs($('scrim'));
    check('wallpaper scrim layer present',
      scrim.backgroundImage.includes('gradient') && scrim.pointerEvents === 'none',
      scrim.backgroundImage.slice(0, 40));
    check('content layer above scrim',
      cs($('app')).zIndex === '2' && scrim.zIndex === '1');
    // 2.1 hover transitions (rules) + card lift
    check('bookmark card hover lift rule',
      ruleFor('.bookmark:hover') && ruleFor('.bookmark:hover').style.transform.includes('translateY'));
    check('bookmark card transition includes transform',
      ruleFor('.bookmark') &&
      ruleFor('.bookmark').style.transitionProperty.includes('transform'));
    check('delete button hover red rule',
      ruleFor('.bm-ops .bm-delete:hover') &&
      ruleFor('.bm-ops .bm-delete:hover').style.background.includes('200, 40, 40'));
    check('engine pill hover rule', !!ruleFor('.engine-bar button:hover:not(.active)'));
    // 2.2 search button micro-motion
    check('search-go hover motion rule',
      ruleFor('#search-go:hover') && ruleFor('#search-go:hover').style.transform.includes('translateY'));
    check('search-go transition includes transform',
      cs($('search-go')).transitionProperty.includes('transform'));
    // 2.3 modal animation + backdrop blur
    check('modal pop animation',
      cs($('bm-modal').querySelector('.modal')).animationName === 'modal-pop');
    check('modal backdrop has blur',
      cs($('settings-modal')).backdropFilter.includes('blur'));
    check('dead selector removed', !ruleFor('.modal-actions button secondary'));
    // 2.4 empty state dashed
    check('empty state dashed drop-zone style',
      cs($('bm-empty')).borderStyle.includes('dashed'));
    // 2.5 responsive grid
    check('bookmark grid widened (880px at 1280 viewport)',
      Math.round(parseFloat(cs($('bookmarks')).width)) === 880,
      cs($('bookmarks')).width);
    check('grid template uses 104px min tracks',
      ruleFor('.bm-grid') &&
      ruleFor('.bm-grid').style.gridTemplateColumns.includes('minmax(104px'));

    // -- ui-a11y-polish: presentation assertions --
    // 2.1 scrollbar styling
    const sbTrack = rulesWhere(r => r.selectorText === '::-webkit-scrollbar');
    check('webkit scrollbar track rules present',
      sbTrack.length > 0 && sbTrack[0].style.width === '10px');
    const sbThumb = rulesWhere(r => r.selectorText === '::-webkit-scrollbar-thumb');
    check('webkit scrollbar thumb rounded and translucent',
      sbThumb.length > 0 &&
      sbThumb[0].style.borderRadius === '999px' &&
      sbThumb[0].style.background.includes('255, 255, 255'));
    // standard scrollbar props must only live inside @supports blocks
    let stdInSupports = false;
    let stdAtTopLevel = false;
    for (const sheet of document.styleSheets) {
      for (const rule of sheet.cssRules) {
        if (rule instanceof CSSSupportsRule) {
          for (const inner of rule.cssRules) {
            if (inner.style && inner.style.scrollbarWidth) {
              stdInSupports = true;
            }
          }
        } else if (rule.style && rule.style.scrollbarWidth) {
          stdAtTopLevel = true;
        }
      }
    }
    check('standard scrollbar props gated behind @supports',
      stdInSupports && !stdAtTopLevel);
    // 2.2 font stack
    const bodyFont = cs(document.body).fontFamily;
    check('font stack covers CN platforms and emoji',
      bodyFont.includes('PingFang SC') && bodyFont.includes('Segoe UI Emoji'));
    // 2.3 reduced-motion kill-switch rule (present regardless of preference)
    const rmRule = rulesWhere(
      r => r instanceof CSSMediaRule &&
        r.media.mediaText.includes('prefers-reduced-motion: reduce'),
    )[0];
    check('reduced-motion kill-switch rule present',
      !!rmRule && rmRule.cssRules.length > 0 &&
      rmRule.cssRules[0].style.animationDuration === '0.01ms' &&
      rmRule.cssRules[0].style.transitionDuration === '0.01ms');
    // under --force-prefers-reduced-motion the effect itself is asserted;
    // in a normal run this segment self-skips
    if (matchMedia('(prefers-reduced-motion: reduce)').matches) {
      check('reduced-motion zeroes wallpaper fade duration',
        parseFloat(cs(document.querySelector('.wallpaper-layer')).transitionDuration) <= 0.001);
      check('reduced-motion zeroes toast animation duration',
        parseFloat(cs($('toast')).animationDuration) <= 0.001);
    }
    // 3.2 wallpaper layers exist and never intercept input
    check('two wallpaper layers present, pointer-events none',
      document.querySelectorAll('.wallpaper-layer').length === 2 &&
      [...document.querySelectorAll('.wallpaper-layer')]
        .every(l => cs(l).pointerEvents === 'none'));
    check('initial wallpaper layer visible',
      await until(() => activeWallpaper() &&
        activeWallpaper().style.backgroundImage.includes('w1.svg') &&
        activeWallpaper().classList.contains('visible')),
      activeWallpaper() && activeWallpaper().className);

    // -- bookmark add via real form --
    $('bm-add').click();
    check('add form opens', !$('bm-modal').hidden);
    $('bm-form').elements.name.value = '示例站';
    $('bm-form').elements.url.value = 'example.com';
    $('bm-form').dispatchEvent(new Event('submit', { cancelable: true }));
    check('form closes after submit', $('bm-modal').hidden);
    await tick();
    check('bookmark appears in grid', gridItems().length === 1);
    check('grid resolves at least 6 columns with content',
      cs(document.querySelector('.bm-group .bm-grid')).gridTemplateColumns.split(' ').filter(v => v !== '0px').length >= 6,
      cs(document.querySelector('.bm-group .bm-grid')).gridTemplateColumns);
    check('bookmark url normalized in title',
      gridItems()[0].title === 'https://example.com');
    const stored = JSON.parse(localStorage.getItem('mtab.config'));
    check('save effect persisted to localStorage',
      stored.groups[0].bookmarks.length === 1 &&
      stored.groups[0].bookmarks[0].url === 'https://example.com', stored);

    // -- bookmark icon fallback (bad favicon host) --
    // simulate by adding a bookmark with an unreachable icon: rely on onerror
    window.mtab.dispatch({ type: 'bookmark_add', name: '本地', url: 'http://localhost:9/nope' });
    await new Promise(r => setTimeout(r, 200));
    // favicon request fails async; the fallback replaces the img when it errors
    const hasImgOrFallback = gridItems().every(b => b.querySelector('img') || b.querySelector('.bm-fallback'));
    check('grid items render icon or fallback', hasImgOrFallback);

    // -- bookmark edit via form --
    const firstId = allBookmarkIds().find(id => id !== 'b2'); // the example one
    const cardOf = id => gridItems().find(c => c.dataset.id === id);
    cardOf(firstId).querySelector('.bm-edit').click();
    check('edit form opens with values', !$('bm-modal').hidden &&
      $('bm-form').elements.url.value === 'https://example.com');
    $('bm-form').elements.name.value = '改名了';
    $('bm-form').elements.url.value = 'https://changed.example.com/path';
    $('bm-form').dispatchEvent(new Event('submit', { cancelable: true }));
    await tick();
    check('edit reflected in grid',
      cardOf(firstId).querySelector('.bm-name').textContent === '改名了');

    // -- invalid url via form -> notify (toast), no state change --
    const beforeCount = allBookmarkIds().length;
    $('bm-add').click();
    $('bm-form').elements.url.value = 'not a url';
    $('bm-form').dispatchEvent(new Event('submit', { cancelable: true }));
    check('invalid url shows toast', !$('toast').hidden, $('toast').textContent);
    check('invalid url not added', allBookmarkIds().length === beforeCount);
    $('toast').hidden = true;

    // -- bookmark click opens new tab --
    cardOf(firstId).click();
    check('bookmark click opens url in new tab',
      opened.includes('https://changed.example.com/path'), opened);

    // -- bookmark delete --
    const idsBeforeDelete = allBookmarkIds().join(',');
    cardOf(firstId).querySelector('.bm-delete').click();
    await until(() => gridItems().length === beforeCount - 1);
    check('bookmark deleted from grid', gridItems().length === beforeCount - 1,
      { count: gridItems().length, beforeCount, idsBeforeDelete,
        after: allBookmarkIds().join(','),
        toast: $('toast').hidden ? null : $('toast').textContent });

    // -- bookmark groups: lifecycle via real UI (bookmark-groups D4/D5) --
    // add a group through the button (prompt is stubbed below)
    const realPrompt = window.prompt;
    window.prompt = () => '工作';
    $('group-add').click();
    await until(() => groupState().length === 2);
    check('group added with name', groupState()[1].name === '工作');
    // add a bookmark INTO that group via the form dropdown
    $('bm-add').click();
    $('bm-form').elements.name.value = '组内书签';
    $('bm-form').elements.url.value = 'grouped.example.com';
    $('bm-form').elements.group.value = groupState()[1].id;
    $('bm-form').dispatchEvent(new Event('submit', { cancelable: true }));
    await until(() => groupState()[1].bookmarks.length === 1);
    check('add via dropdown lands in the named group',
      groupState()[1].bookmarks[0].url === 'https://grouped.example.com');
    // pointer drag: move that bookmark back to the default group
    const g1card = groupSections()[1].querySelector('.bookmark');
    const g0grid = groupSections()[0].querySelector('.bm-grid');
    const g0rect = g0grid.getBoundingClientRect();
    pointerDrag(g1card, 0, g0rect.top + 10 - g1card.getBoundingClientRect().top);
    await until(() => groupState()[0].bookmarks.some(b => b.url === 'https://grouped.example.com'));
    check('pointer drag moves bookmark across groups',
      groupState()[1].bookmarks.length === 0 &&
      groupState()[0].bookmarks.some(b => b.url === 'https://grouped.example.com'),
      allBookmarkIds());
    // pointer drag within the default group: move first card onto the last
    const idsBeforeDrag = groupState()[0].bookmarks.map(b => b.id).join(',');
    const cards0 = () => [...groupSections()[0].querySelectorAll('.bookmark')];
    if (cards0().length >= 2) {
      const last = cards0()[cards0().length - 1];
      const lr = last.getBoundingClientRect();
      pointerDrag(cards0()[0], lr.left + lr.width / 2 - cards0()[0].getBoundingClientRect().left, 0);
      await tick();
      check('pointer drag reorders within the group',
        groupState()[0].bookmarks.map(b => b.id).join(',') !== idsBeforeDrag,
        { before: idsBeforeDrag, after: groupState()[0].bookmarks.map(b => b.id).join(',') });
    } else {
      check('pointer drag reorders within the group (skipped: <2 cards)', true);
    }
    // sub-threshold movement must NOT trigger a move (click passthrough)
    const orderBefore = allBookmarkIds().join(',');
    const anyCard = cards0()[0];
    pointerDrag(anyCard, 1, 1);
    await tick();
    check('tiny pointer movement does not reorder',
      allBookmarkIds().join(',') === orderBefore);
    // rename the group via its header button
    window.prompt = () => '学习';
    groupSections()[1].querySelector('.bm-group-rename').click();
    await until(() => groupState()[1].name === '学习');
    check('group renamed', groupState()[1].name === '学习');
    // delete the group: its bookmarks (none now) fall back — with one left
    // put a bookmark back into g1 first via dispatch, then delete
    const g1id = groupState()[1].id;
    window.mtab.dispatch({ type: 'bookmark_move', id: groupState()[0].bookmarks[0].id, to_group: g1id, to_index: 0 });
    await until(() => groupState()[1].bookmarks.length === 1);
    groupSections()[1].querySelector('.bm-group-del').click();
    await until(() => groupState().length === 1);
    check('group delete falls bookmarks back into g0',
      groupState()[0].bookmarks.length >= 1,
      allBookmarkIds());
    window.prompt = realPrompt;

    // -- group collapse + wallpaper blur (group-collapse-blur) --
    window.prompt = () => '折叠测试';
    $('group-add').click();
    await until(() => groupState().length === 2);
    const g1section = () => groupSections()[1];
    g1section().querySelector('.bm-group-toggle').click();
    await until(() => groupState()[1].collapsed === true);
    check('collapse hides the grid',
      g1section().classList.contains('collapsed') &&
      cs(g1section().querySelector('.bm-grid')).display === 'none');
    check('collapse persisted',
      JSON.parse(localStorage.getItem('mtab.config')).groups[1].collapsed === true);
    g1section().querySelector('.bm-group-toggle').click();
    await until(() => groupState()[1].collapsed === false);
    check('expand restores the grid',
      !g1section().classList.contains('collapsed') &&
      cs(g1section().querySelector('.bm-grid')).display === 'grid');
    // wallpaper blur: slider drives the store and the layers
    $('settings-open').click();
    const blurSlider = $('wallpaper-blur');
    blurSlider.value = '8';
    blurSlider.dispatchEvent(new Event('change', { bubbles: true }));
    await until(() => window.mtab.config.wallpaperBlur === 8);
    check('blur slider persists amount',
      JSON.parse(localStorage.getItem('mtab.config')).wallpaperBlur === 8);
    check('wallpaper layers carry the blur filter',
      [...document.querySelectorAll('.wallpaper-layer')]
        .every(l => l.style.filter === 'blur(8px)'));
    blurSlider.value = '0';
    blurSlider.dispatchEvent(new Event('change', { bubbles: true }));
    await until(() => window.mtab.config.wallpaperBlur === 0);
    check('blur 0 removes the filter',
      [...document.querySelectorAll('.wallpaper-layer')]
        .every(l => l.style.filter === ''));
    $('settings-close').click();
    window.prompt = realPrompt;

    // -- engine switch via click --
    const bingBtn = [...document.querySelectorAll('#engine-bar button')]
      .find(b => b.textContent === 'Bing');
    bingBtn.click();
    await tick();
    check('engine switch moves active marker',
      document.querySelector('#engine-bar button.active').textContent === 'Bing');
    check('engine choice persisted',
      JSON.parse(localStorage.getItem('mtab.config')).search.current === 'bing');

    // -- empty search must not navigate --
    window.mtab.dispatch({ type: 'search_submit', query: '   ' });
    check('empty keyword does not navigate', location.href.includes('test-harness'));

    // -- search history suggestions (search-history change) --
    // NOTE: real search_submit triggers open_url navigation, which would
    // leave the harness page. Seed history through config_import instead
    // (a valid persisted-config shape), then exercise the non-navigating
    // paths: focus/input/keyboard-highlight/Esc/delete/clear.
    const suggestBox = $('search-suggest');
    const suggestItems = () => [...suggestBox.querySelectorAll('.suggest-item')];
    const typeQuery = async q => {
      $('search-input').value = q;
      $('search-input').dispatchEvent(new Event('input', { bubbles: true }));
      await tick();
    };
    const cfgWithHistory = JSON.parse(JSON.stringify(window.mtab.config));
    cfgWithHistory.search.history = [
      { query: 'moonbit 入门', count: 3, lastUsedMs: 3000 },
      { query: 'mooncake 食谱', count: 1, lastUsedMs: 4000 },
      { query: '农历 节气', count: 2, lastUsedMs: 5000 },
    ];
    window.mtab.dispatch({ type: 'config_import', json: JSON.stringify(cfgWithHistory) });
    await tick();
    check('imported history persisted',
      JSON.parse(localStorage.getItem('mtab.config')).search.history.length === 3);
    // focus on empty input -> recent 6, newest first
    $('search-input').value = '';
    $('search-input').dispatchEvent(new Event('focus'));
    await tick();
    check('focus on empty input shows recent history',
      !suggestBox.hidden && suggestItems().length === 3 &&
      suggestItems()[0].dataset.query === '农历 节气',
      suggestItems().map(i => i.dataset.query));
    // typed prefix filter (case-insensitive)
    await typeQuery('MOON');
    check('typed prefix filters case-insensitively',
      suggestItems().map(i => i.dataset.query).join(',') === 'mooncake 食谱,moonbit 入门',
      suggestItems().map(i => i.dataset.query));
    // no match -> dropdown hidden
    await typeQuery('zzz');
    check('no matching prefix hides dropdown',
      suggestBox.hidden || suggestItems().length === 0);
    // keyboard: ArrowDown highlights first entry
    await typeQuery('moon');
    $('search-input').dispatchEvent(new KeyboardEvent('keydown', { key: 'ArrowDown', bubbles: true, cancelable: true }));
    check('arrow-down highlights first entry',
      suggestItems()[0].classList.contains('active') &&
      suggestItems()[0].getAttribute('aria-selected') === 'true');
    // Esc closes, input untouched
    $('search-input').dispatchEvent(new KeyboardEvent('keydown', { key: 'Escape', bubbles: true, cancelable: true }));
    check('escape closes suggestions, input preserved',
      suggestBox.hidden && $('search-input').value === 'moon');
    // single-entry delete via the x button (mousedown delegation)
    $('search-input').dispatchEvent(new Event('focus'));
    await tick();
    const victim = suggestItems()[0].dataset.query;
    suggestItems()[0].querySelector('.suggest-del').dispatchEvent(
      new Event('mousedown', { bubbles: true, cancelable: true }));
    await until(() => !window.mtab.config.search.history.some(h => h.query === victim));
    check('single delete removes entry from history',
      !window.mtab.config.search.history.some(h => h.query === victim),
      window.mtab.config.search.history.map(h => h.query));
    // clear all via settings button
    $('settings-open').click();
    $('history-clear').click();
    await tick();
    check('history clear empties store',
      window.mtab.config.search.history.length === 0);
    check('history clear persisted',
      JSON.parse(localStorage.getItem('mtab.config')).search.history.length === 0);
    $('toast').hidden = true;
    $('settings-close').click();
    $('search-input').dispatchEvent(new Event('focus'));
    await tick();
    check('focus after clear shows no suggestions',
      suggestBox.hidden || suggestItems().length === 0);

    // -- solar term / festival in the date line (solar-terms-festivals) --
    // drive a known term day through the real tick_date path
    window.mtab.dispatch({ type: 'tick_date', date: '2025-10-08' });
    await tick();
    check('date line shows 寒露 on term day',
      $('clock-date').textContent.includes('寒露'));
    // ux-polish-2: term renders as a clickable badge, textContent intact
    const termBadge = document.querySelector('#clock-date .badge-term');
    check('term rendered as badge', !!termBadge);
    termBadge.click();
    check('term modal opens with name, blurb and longitude',
      !$('term-modal').hidden &&
      $('term-modal-name').textContent === '寒露' &&
      $('term-modal-blurb').textContent.length > 0 &&
      $('term-modal-lon').textContent.includes('195'));
    $('term-modal-close').click();
    check('term modal closes via button', $('term-modal').hidden);
    termBadge.click();
    document.dispatchEvent(new KeyboardEvent('keydown', { key: 'Escape', bubbles: true }));
    check('term modal closes via Escape', $('term-modal').hidden);
    // festival day: festival wins (春节 2025-01-29, also no term that day)
    window.mtab.dispatch({ type: 'tick_date', date: '2025-01-29' });
    await tick();
    check('date line shows 春节 festival',
      $('clock-date').textContent.includes('春节'));
    check('traditional festival badge class',
      document.querySelector('#clock-date .clock-badge')?.className.includes('badge-festival traditional'));
    // statutory festival badge (国庆 10-01): warm red, no traditional
    window.mtab.dispatch({ type: 'tick_date', date: '2025-10-01' });
    await tick();
    check('statutory festival badge class',
      document.querySelector('#clock-date .clock-badge')?.className === 'clock-badge badge-festival');
    // ordinary day: neither term nor festival appears
    window.mtab.dispatch({ type: 'tick_date', date: '2025-10-07' });
    await tick();
    check('date line plain on ordinary day',
      !$('clock-date').textContent.includes('寒露') &&
      !$('clock-date').textContent.includes('春节'));
    // restore today so later wallpaper/other checks are unaffected
    window.mtab.dispatch({ type: 'tick_date', date: new Date().toISOString().slice(0, 10) });
    await tick();

    // -- ux-polish-2: presentation rules --
    check('clock badge variant rules present',
      ruleFor('.clock-badge.badge-festival') &&
      ruleFor('.clock-badge.badge-festival.traditional') &&
      ruleFor('.clock-badge.badge-term'));
    check('search focus lift adds transform',
      ruleFor('#search-input:focus') &&
      ruleFor('#search-input:focus').style.transform.includes('translateY'));
    const suggestShown = rulesWhere(
      r => r.selectorText === '.search-suggest:not([hidden])',
    );
    check('suggestion panel entrance animation',
      suggestShown.length > 0 &&
      suggestShown[0].style.animationName === 'suggest-in');
    check('suggest item hover shift rule',
      ruleFor('.suggest-item:hover') &&
      ruleFor('.suggest-item:hover').style.paddingLeft !== '');

    // -- widget toggle via settings --
    $('settings-open').click();
    check('settings panel opens', !$('settings-modal').hidden);
    $('toggle-clock').click();
    await tick();
    check('clock hidden after toggle', $('clock').hidden);
    check('toggle persisted', JSON.parse(localStorage.getItem('mtab.config')).widgets.clock === false);
    $('toggle-clock').click();
    await tick();
    check('clock restored', !$('clock').hidden);

    // -- builtin wallpaper via click (crossfade, design D4) --
    const w2 = document.querySelector('[data-wp="w2"]');
    w2.click();
    const fadedIn = await until(() => {
      const l = activeWallpaper();
      return l && l.style.backgroundImage.includes('w2.svg') &&
        l.classList.contains('visible');
    });
    check('builtin wallpaper layer swapped with fade class', fadedIn,
      activeWallpaper() && activeWallpaper().className);
    const retired = await until(() =>
      document.querySelectorAll('.wallpaper-layer.visible').length === 1);
    check('previous wallpaper layer retired', retired);
    check('wallpaper persisted',
      JSON.parse(localStorage.getItem('mtab.config')).wallpaper.id === 'w2');
    $('settings-close').click();
    check('settings panel closes', $('settings-modal').hidden);

    // -- upload wallpaper through the real handler (canvas compress) --
    const canvas = document.createElement('canvas');
    canvas.width = 64;
    canvas.height = 32;
    canvas.getContext('2d').fillRect(0, 0, 64, 32);
    const blob = await new Promise(r => canvas.toBlob(r, 'image/png'));
    const imgFile = new File([blob], 'wall.png', { type: 'image/png' });
    let bmpErr = 'n/a';
    try {
      const probe = await createImageBitmap(imgFile);
      probe.close();
      bmpErr = 'ok';
    } catch (e) {
      bmpErr = String(e);
    }
    check('createImageBitmap works headless', bmpErr === 'ok', bmpErr);
    const dt = new DataTransfer();
    dt.items.add(imgFile);
    $('wallpaper-upload').files = dt.files;
    $('wallpaper-upload').dispatchEvent(new Event('change'));
    const uploaded = await until(() =>
      activeWallpaper() &&
      activeWallpaper().style.backgroundImage.startsWith('url("data:image/jpeg'));
    check('uploaded wallpaper applied as data url', uploaded,
      activeWallpaper() && activeWallpaper().style.backgroundImage.slice(0, 40));
    check('custom wallpaper persisted',
      JSON.parse(localStorage.getItem('mtab.config')).wallpaper.type === 'custom');

    // -- crossfade degrade path (ui-a11y-polish D1): an undecodable image
    // must apply immediately instead of blocking the wallpaper --
    window.mtab.dispatch({ type: 'wallpaper_set_custom', data: 'data:image/png;base64,###' });
    const brokenApplied = await until(() =>
      activeWallpaper() &&
      activeWallpaper().style.backgroundImage.includes('base64,###') &&
      activeWallpaper().classList.contains('visible'));
    check('undecodable wallpaper degrades to immediate apply', brokenApplied,
      activeWallpaper() && activeWallpaper().className);

    // -- toast semantics (ui-polish 3.1) --
    // export success shows the green variant
    $('settings-open').click();
    $('config-export').click();
    check('export toast uses success variant',
      !$('toast').hidden && $('toast').classList.contains('success'),
      $('toast').textContent);
    $('toast').hidden = true;
    $('toast').classList.remove('success');
    $('settings-close').click();

    // -- non-image upload rejected --
    const txtFile = new File(['x'], 'a.txt', { type: 'text/plain' });
    const dt2 = new DataTransfer();
    dt2.items.add(txtFile);
    const beforeBg = activeWallpaper() && activeWallpaper().style.backgroundImage;
    $('wallpaper-upload').files = dt2.files;
    $('wallpaper-upload').dispatchEvent(new Event('change'));
    await new Promise(r => setTimeout(r, 100));
    check('non-image upload rejected, wallpaper unchanged',
      (activeWallpaper() && activeWallpaper().style.backgroundImage) === beforeBg &&
      !$('toast').hidden && !$('toast').classList.contains('success'),
      $('toast').textContent);

    // -- import through the real file input --
    // v1-shaped file (flat bookmarks) exercises the migration path
    const exportNow = JSON.stringify(window.mtab.config);
    const modified = JSON.parse(exportNow);
    modified.version = 1;
    modified.widgets.clock = false;
    modified.bookmarks = [{ id: 'bx', name: '导入的', url: 'https://imported.example.com' }];
    delete modified.groups;
    const cfgFile = new File([JSON.stringify(modified)], 'cfg.json', { type: 'application/json' });
    const dt3 = new DataTransfer();
    dt3.items.add(cfgFile);
    $('config-import').files = dt3.files;
    $('config-import').dispatchEvent(new Event('change'));
    await until(() => groupState().length >= 1 &&
      allBookmarkIds().includes('bx'));
    check('v1 import replaces bookmarks (migrated into default group)',
      gridItems().length === 1 &&
        gridItems()[0].querySelector('.bm-name').textContent === '导入的',
      gridItems().map(b => b.querySelector('.bm-name')?.textContent));
    check('import hides clock per file', $('clock').hidden);

    // -- invalid import keeps current state --
    const before = JSON.stringify(window.mtab.config);
    const badFile = new File(['{{broken'], 'bad.json', { type: 'application/json' });
    const dt4 = new DataTransfer();
    dt4.items.add(badFile);
    $('config-import').files = dt4.files;
    $('config-import').dispatchEvent(new Event('change'));
    await new Promise(r => setTimeout(r, 200));
    check('invalid import keeps config', JSON.stringify(window.mtab.config) === before);
    check('invalid import shows toast', !$('toast').hidden);

    const failed = results.filter(r => !r.ok).length;
    const summary = document.createElement('p');
    summary.id = 'test-summary';
    summary.textContent = failed === 0
      ? `ALL ${results.length} BROWSER CHECKS PASSED`
      : `${failed} OF ${results.length} BROWSER CHECKS FAILED`;
    summary.style.color = failed === 0 ? '#0a0' : '#d00';
    document.getElementById('test-results').prepend(summary);
    // Signal completion for dump-dom grep.
    document.title = 'HARNESS-' + (failed === 0 ? 'PASS' : 'FAIL');
  </script>
</body>
</html>
